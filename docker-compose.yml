services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_PATH: /data/bobcat.db
      SCRAPE_INTERVAL_HOURS: "6"
    volumes:
      - db_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  db_data:
