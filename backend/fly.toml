app = "bobcat-bulletin-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  dockerignore_file = ".dockerignore"

[env]
  SCRAPE_INTERVAL_HOURS = "6"
  DB_PATH = "/data/bobcat.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "bobcat_data"
  destination = "/data"
  initial_size = "1gb"
